<!DOCTYPE HTML>
<html>
<head>
    <title>Checkout - Infinite Galleria</title>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <link rel="stylesheet" href="assets/css/main.css" />
    
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;600&family=Playfair+Display:ital,wght@0,400;0,700;1,400&display=swap" rel="stylesheet">

    <style>
        body { 
            background: #d4cbba; 
            color: #1a1a1a; 
            display: flex; 
            justify-content: center; 
            align-items: center; 
            min-height: 100vh;
            margin: 0;
            font-family: 'Inter', sans-serif; /* Font güncellendi */
        }
        .checkout-box { 
            background: #e8e4da; 
            padding: 50px 40px; 
            border: 2px solid #1a1a1a; 
            width: 100%; 
            max-width: 450px; 
            text-align: center; 
            box-shadow: 10px 10px 0px rgba(0,0,0,0.1);
        }
        /* --- "SECURE CHECKOUT" BAŞLIĞI (DÜZELTİLMİŞ) --- */
        .checkout-box h2 {
            margin-bottom: 20px;
            letter-spacing: 2px;
            font-weight: 800;
            text-transform: uppercase;
            /* Şekilli font yerine standart font */
            font-family: 'Inter', sans-serif !important; 
            /* Renk siyah yapıldı */
            color: #1a1a1a !important; 
        }
        
        /* Ürün Özeti Kartı */
        .order-summary {
            background: #d4cbba;
            border: 1px solid #1a1a1a;
            padding: 20px;
            margin-bottom: 30px;
            text-align: left;
            display: flex;
            align-items: center;
            gap: 15px;
        }
        
        /* Küçük resim ayarı */
        .order-summary img {
            width: 80px;
            height: 80px;
            object-fit: cover;
            border: 1px solid #1a1a1a;
            display: none; /* JS ile resim gelince görünür olacak */
        }

        .product-info h4 {
            margin: 0;
            font-size: 1.1em;
            color: #1a1a1a;
            font-weight: 800;
            font-family: 'Playfair Display', serif;
        }
        .product-info span {
            display: block;
            font-size: 0.9em;
            opacity: 0.8;
            margin-top: 5px;
            font-family: 'Inter', sans-serif;
        }
        .price-tag {
            margin-top: 5px;
            font-weight: 800;
            font-size: 1.2em;
            color: #1a1a1a;
        }

        /* Form Elemanları */
        input[type="email"] {
            width: 100%;
            padding: 15px;
            background: transparent;
            border: 1.5px solid #1a1a1a;
            color: #1a1a1a;
            margin-bottom: 15px;
            outline: none;
            font-weight: 600;
            font-family: 'Inter', sans-serif;
        }
        
       /* --- PROCEED TO PAYMENT BUTONU --- */
        .button.primary { 
            display: flex !important;
            justify-content: center !important;
            align-items: center !important;
            width: 100% !important;
            height: 60px !important;
            padding: 0 !important;
            margin-top: 20px !important;
            background: #1a1a1a !important; 
            color: #d4cbba !important; 
            border: none !important;
            font-weight: 800 !important;
            letter-spacing: 2px !important;
            text-transform: uppercase !important;
            line-height: 1 !important;
            cursor: pointer;
            transition: all 0.3s ease;
            font-family: 'Inter', sans-serif;
        }

        .button.primary:hover {
            background: #333 !important;
            transform: translateY(-2px);
        }
    </style>
</head>
<body>

    <div class="checkout-box">
        <h2>Secure Checkout</h2>
        
        <div id="order-card" class="order-summary">
            <p style="width:100%; text-align:center;">Loading details...</p>
        </div>

        <form action="#" method="POST">
            <input type="email" placeholder="Your Email Address" required>
            <button type="submit" class="button primary">Proceed to Payment</button>
        </form>
        
        <p style="margin-top: 20px; font-size: 0.7em; opacity: 0.6; text-transform: uppercase; letter-spacing: 1px;">
            Engineered for Security
        </p>
    </div>

    <script>
      // 1. Ürün Kataloğu
        const products = {
            'art1': {
                title: "The Obsidian Monolith",
                image: "images/art1.jpg"
            },
            'art2': {
                title: "Ethereal Structuralism",
                image: "images/art2.jpg"
            },
            'art3': {
                title: "The Cliffside Archive of Time",
                image: "images/art3.jpg"
            }
        };

        // 2. URL'deki parametreleri oku
        const params = new URLSearchParams(window.location.search);
        const productId = params.get('product'); // URL'de 'product=' arar
        const tierType = params.get('tier');     // URL'de 'tier=' arar

        // 3. Fiyat ve Paket İsmini Belirle (3'lü Sistem)
        let price = "$0";
        let tierName = "Unknown";

        if (tierType === 'standard') {
            // STANDARD PAKET
            price = "$49";
            tierName = "Standard Edition (Personal)";
        } 
        else if (tierType === 'extended') {
            // COMMERCIAL PAKET (YENİ)
            price = "$199";
            tierName = "Commercial License (Business)";
        } 
        else if (tierType === 'exclusive') {
            // EXCLUSIVE PAKET
            price = "$499";
            tierName = "Exclusive Ownership (Buyout)";
        }

        // 4. HTML Kutusunu Doldur
        const container = document.getElementById('order-card');

        if (products[productId]) {
            const art = products[productId];
            
            // Resmi ve yazıları basıyoruz
            container.innerHTML = `
                <img src="${art.image}" alt="${art.title}" style="display:block;">
                <div class="product-info">
                    <h4>${art.title}</h4>
                    <span>${tierName}</span>
                    <div class="price-tag">${price}</div>
                </div>
            `;
        } else {
            // Eğer ürün bulunamazsa hata mesajı
            container.innerHTML = `<p style="color:red; text-align:center;">Error: Product or package not found.</p>`;
        }
    </script>

</body>
</html>
