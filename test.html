<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Infinite Galleria - Elite Glide Effect</title>
    <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:ital,wght@0,400;1,400&display=swap" rel="stylesheet">
    
    <style>
        /* Arkadaki iğrenç kaydırma çubuklarını tamamen yok ediyoruz */
        body, html {
            margin: 0; padding: 0; 
            background-color: #0b0b0b; color: #fff;
            font-family: 'Playfair Display', serif;
            overflow: hidden; /* Sitenin kendi kaymasını kilitliyoruz */
        }

        /* İŞTE SİHİR BURADA: MIKNATIS GİBİ ÇEKEN TAŞIYICI */
        .gallery-container {
            height: 100vh;
            overflow-y: scroll;
            /* Scroll Snapping: Kullanıcı azıcık kaydırsa bile resmi tam ortalar */
            scroll-snap-type: y mandatory; 
            scroll-behavior: smooth; /* Tereyağı gibi kayma efekti */
            
            /* İçerideki kaydırma çubuğunu gizle */
            scrollbar-width: none; 
            -ms-overflow-style: none;
        }
        .gallery-container::-webkit-scrollbar { display: none; }

        /* HER BİR ESERİN EKRANI */
        .art-panel {
            height: 100vh; 
            width: 100%;
            display: flex; flex-direction: column; 
            align-items: center; justify-content: center;
            /* Mıknatısın kilitleneceği nokta (Tam başı) */
            scroll-snap-align: start; 
            position: relative;
        }

        /* 1:1 KARE RESİM AYARI */
        .art-image {
            width: 100%;
            max-width: 65vh; 
            aspect-ratio: 1 / 1; 
            object-fit: cover;
            /* Tablo gibi dursun diye derinlik (Siyah üzerine daha da siyah gölge) */
            box-shadow: 0 40px 80px rgba(0,0,0,0.9); 
            /* Ufak bir nefes alma animasyonu ekledik */
            transition: transform 1.5s cubic-bezier(0.25, 1, 0.5, 1);
        }

        /* Fare üstüne gelince resim çok hafif, sinematik bir şekilde büyür */
        .art-panel:hover .art-image {
            transform: scale(1.03);
        }

        .art-title {
            margin-top: 40px;
            font-size: 1.5rem;
            letter-spacing: 4px;
            text-transform: uppercase;
            color: #c89666; 
            opacity: 0.9;
        }
        
        .art-collection {
            font-size: 0.9rem;
            color: #555;
            font-style: italic;
            margin-top: 8px;
            letter-spacing: 1px;
        }
    </style>
</head>
<body>

    <div class="gallery-container">
        
        <div class="art-panel">
            <img src="images/art1.jpg" alt="The Obsidian Monolith" class="art-image">
            <div class="art-title">The Obsidian Monolith</div>
            <div class="art-collection">Coastal Brutalism</div>
        </div>

        <div class="art-panel">
            <img src="images/art2.jpg" alt="The Symbiotic Atrium" class="art-image">
            <div class="art-title">The Symbiotic Atrium</div>
            <div class="art-collection">Symbiosis</div>
        </div>

        <div class="art-panel">
            <img src="images/art3.jpg" alt="Ethereal Structuralism" class="art-image">
            <div class="art-title">Ethereal Structuralism</div>
            <div class="art-collection">Architectural Interiors</div>
        </div>

    </div>

</body>
</html>
