<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Infinite Galleria - Auto-Snap Cinematic</title>
    <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:ital,wght@0,400;1,400&display=swap" rel="stylesheet">
    
    <style>
        /* Elit stüdyo arka planı - Sabit kalır */
        body, html {
            margin: 0; padding: 0; 
            background: linear-gradient(135deg, #0f0f0f 0%, #050505 100%);
            color: #fff;
            font-family: 'Playfair Display', serif;
            overflow: hidden; /* Sitenin ana kaydırmasını kilitliyoruz */
        }

        /* İŞTE MIKNATIS MERKEZİ: Kaydırma işlemi bu kutunun içinde olacak */
        .gallery-container {
            height: 100vh;
            width: 100%;
            overflow-y: scroll;
            /* Scroll Snapping: 2-3 tık kaydırdığında kontrolü senden alır ve merkeze çeker */
            scroll-snap-type: y mandatory; 
            scroll-behavior: smooth;
            
            /* İğrenç çubukları gizle */
            scrollbar-width: none; 
            -ms-overflow-style: none;
        }
        .gallery-container::-webkit-scrollbar { display: none; }

        /* HER BİR SERGİ ODASI */
        .art-panel {
            height: 100vh; 
            width: 100%;
            display: flex; flex-direction: column; 
            align-items: center; justify-content: center;
            
            /* Mıknatısın kilitleneceği yer: TAM MERKEZ */
            scroll-snap-align: center; 
            
            /* Zarif bakır spot ışığı */
            background: radial-gradient(circle at center, rgba(200, 150, 102, 0.12) 0%, rgba(15, 15, 15, 0) 65%);
            position: relative;
            overflow: hidden;
        }

        /* RESİM BOYUTU 68VH'A DÜŞTÜ (Ekrana yazıyla beraber kusursuz oturur) */
        .art-image {
            height: 68vh;  
            width: 68vh;   
            max-width: 85vw; 
            max-height: 85vw;
            object-fit: cover;
            box-shadow: 0 40px 100px rgba(0,0,0,0.9); 
            will-change: transform, opacity;
            opacity: 0; 
        }

        .art-info {
            text-align: center;
            margin-top: 30px;
            will-change: transform, opacity;
        }

        .art-title {
            font-size: 1.7rem;
            letter-spacing: 5px;
            text-transform: uppercase;
            color: #c89666; 
            opacity: 0.95;
            text-shadow: 0 5px 15px rgba(0,0,0,0.8);
        }
        
        .art-collection {
            font-size: 0.95rem;
            color: #888;
            font-style: italic;
            margin-top: 8px;
            letter-spacing: 2px;
        }
    </style>
</head>
<body>

    <div class="gallery-container">
        
        <div class="art-panel">
            <img src="images/art1.jpg" alt="The Obsidian Monolith" class="art-image">
            <div class="art-info">
                <div class="art-title">The Obsidian Monolith</div>
                <div class="art-collection">Coastal Brutalism</div>
            </div>
        </div>

        <div class="art-panel">
            <img src="images/art2.jpg" alt="The Symbiotic Atrium" class="art-image">
            <div class="art-info">
                <div class="art-title">The Symbiotic Atrium</div>
                <div class="art-collection">Symbiosis</div>
            </div>
        </div>

        <div class="art-panel">
            <img src="images/art3.jpg" alt="Ethereal Structuralism" class="art-image">
            <div class="art-info">
                <div class="art-title">Ethereal Structuralism</div>
                <div class="art-collection">Architectural Interiors</div>
            </div>
        </div>

    </div>

    <script>
        const container = document.querySelector('.gallery-container');
        let isTicking = false;
        
        function updateParallax() {
            const panels = document.querySelectorAll('.art-panel');
            const windowHeight = window.innerHeight;

            panels.forEach(panel => {
                const rect = panel.getBoundingClientRect();
                const progress = (rect.top + rect.height / 2 - windowHeight / 2) / windowHeight;
                
                const img = panel.querySelector('.art-image');
                const info = panel.querySelector('.art-info');

                if (Math.abs(progress) < 1.5) { 
                    
                    // Resim %12 oranında sana doğru büyüyerek gelir (daha soft)
                    let scale = 1 - (progress * 0.12); 
                    
                    let opacity = 1 - Math.pow(Math.abs(progress), 1.8); // Daha hızlı kararıp aydınlanır
                    if (opacity < 0) opacity = 0;

                    img.style.transform = `scale(${scale})`;
                    img.style.opacity = opacity;
                    
                    info.style.transform = `translateY(${progress * 50}px)`;
                    info.style.opacity = opacity;
                }
            });
            isTicking = false;
        }

        // DİKKAT: Artık window'u değil, container'ı dinliyoruz
        container.addEventListener('scroll', () => {
            if (!isTicking) {
                window.requestAnimationFrame(updateParallax);
                isTicking = true;
            }
        });

        // Başlangıç tetiklemesi
        updateParallax();
    </script>

</body>
</html>
