<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Infinite Galleria - Stacking Effect</title>
    <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:ital,wght@0,400;1,400&display=swap" rel="stylesheet">
    
    <style>
        /* Sitenin elit karanlık arka planı */
        body, html {
            margin: 0;
            padding: 0;
            background-color: #0b0b0b;
            color: #fff;
            font-family: 'Playfair Display', serif;
        }

        /* Bütün resimleri saran ana taşıyıcı */
        .gallery-container {
            position: relative;
        }

        /* HER BİR ESERİN EKRANI */
        /* position: sticky sayesinde sen kaydırsan da ekranda kilitli kalır, 
           ta ki alttaki gelip onun üstünü örtünceye kadar! */
        .art-panel {
            height: 100vh; /* Ekranın boyunu tam kaplar */
            width: 100%;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            position: sticky;
            top: 0;
            background-color: #0b0b0b; 
            /* Alttan gelen resmin üsttekini jilet gibi kesmesi için ufak bir gölge */
            box-shadow: 0 -20px 50px rgba(0,0,0,0.8);
        }

        /* 1:1 KARE RESİM AYARI (Kırpılmayı önleyen mucize kısım) */
        .art-image {
            width: 100%;
            max-width: 65vh; /* Resmin boyu ekran boyunu geçmesin diye fren */
            aspect-ratio: 1 / 1; /* Resmi zorla 1:1 kare yapar */
            object-fit: cover;
            box-shadow: 0 30px 60px rgba(0,0,0,0.9); /* Tablo gibi dursun diye derinlik */
            transition: transform 0.4s ease;
        }

        /* Eserin altındaki başlık */
        .art-title {
            margin-top: 30px;
            font-size: 1.5rem;
            letter-spacing: 3px;
            text-transform: uppercase;
            color: #c89666; /* O sevdiğin bakır rengi */
        }
        
        .art-collection {
            font-size: 0.9rem;
            color: #777;
            font-style: italic;
            margin-top: 5px;
        }
    </style>
</head>
<body>

    <div class="gallery-container">
        
        <div class="art-panel" style="z-index: 1;">
            <img src="https://via.placeholder.com/800x800/1a1a1a/c89666?text=ART+1" alt="Art 1" class="art-image">
            <div class="art-title">The Obsidian Monolith</div>
            <div class="art-collection">Coastal Brutalism</div>
        </div>

        <div class="art-panel" style="z-index: 2;">
            <img src="https://via.placeholder.com/800x800/2a2a2a/c89666?text=ART+2" alt="Art 2" class="art-image">
            <div class="art-title">The Symbiotic Atrium</div>
            <div class="art-collection">Symbiosis</div>
        </div>

        <div class="art-panel" style="z-index: 3;">
            <img src="https://via.placeholder.com/800x800/3a3a3a/c89666?text=ART+3" alt="Art 3" class="art-image">
            <div class="art-title">Ethereal Structuralism</div>
            <div class="art-collection">Architectural Interiors</div>
        </div>

    </div>

</body>
</html>
