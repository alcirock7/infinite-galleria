<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Infinite Galleria - Smart Scroll</title>
    <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:ital,wght@0,400;1,400&display=swap" rel="stylesheet">
    
    <style>
        /* Tarayıcının kendi kaydırmasını KÖKTEN siliyoruz. Kontrol %100 bizde. */
        body, html {
            margin: 0; padding: 0; 
            background: linear-gradient(135deg, #0f0f0f 0%, #050505 100%);
            color: #fff;
            font-family: 'Playfair Display', serif;
            overflow: hidden; 
        }

        /* Tüm galeriyi saran ve yukarı/aşağı kayacak olan asansör kutumuz */
        .gallery-container {
            height: 100vh;
            width: 100%;
            transition: transform 1.2s cubic-bezier(0.25, 1, 0.2, 1); /* O lüks kayma animasyonu */
        }

        /* HER BİR SERGİ ODASI */
        .art-panel {
            height: 100vh; 
            width: 100%;
            display: flex; flex-direction: column; 
            align-items: center; justify-content: center;
            background: radial-gradient(circle at center, rgba(200, 150, 102, 0.12) 0%, rgba(15, 15, 15, 0) 65%);
            position: relative;
        }

        /* RESİM (68vh) */
        .art-image {
            height: 68vh;  
            width: 68vh;   
            max-width: 85vw; 
            max-height: 85vw;
            object-fit: cover;
            box-shadow: 0 40px 100px rgba(0,0,0,0.9); 
            /* Resimler aktif değilken geride ve silik durur */
            transform: scale(0.85) translateY(50px);
            opacity: 0.2;
            transition: all 1.2s cubic-bezier(0.25, 1, 0.2, 1);
        }

        .art-info {
            text-align: center;
            margin-top: 30px;
            transform: translateY(30px);
            opacity: 0;
            transition: all 1s cubic-bezier(0.25, 1, 0.2, 1) 0.2s; /* Yazı resimden 0.2sn sonra gelir */
        }

        /* ==== AKTİF OLAN ESERİN EFEKTLERİ (Ekrana gelince çalışır) ==== */
        .art-panel.active .art-image {
            transform: scale(1) translateY(0); /* Üstüne doğru 3D büyür */
            opacity: 1;
        }

        .art-panel.active .art-info {
            transform: translateY(0);
            opacity: 1;
        }

        .art-title {
            font-size: 1.7rem;
            letter-spacing: 5px;
            text-transform: uppercase;
            color: #c89666; 
            text-shadow: 0 5px 15px rgba(0,0,0,0.8);
        }
        
        .art-collection {
            font-size: 0.95rem;
            color: #888;
            font-style: italic;
            margin-top: 8px;
            letter-spacing: 2px;
        }
    </style>
</head>
<body>

    <div class="gallery-container" id="slider">
        
        <div class="art-panel active">
            <img src="images/art1.jpg" alt="The Obsidian Monolith" class="art-image">
            <div class="art-info">
                <div class="art-title">The Obsidian Monolith</div>
                <div class="art-collection">Coastal Brutalism</div>
            </div>
        </div>

        <div class="art-panel">
            <img src="images/art2.jpg" alt="The Symbiotic Atrium" class="art-image">
            <div class="art-info">
                <div class="art-title">The Symbiotic Atrium</div>
                <div class="art-collection">Symbiosis</div>
            </div>
        </div>

        <div class="art-panel">
            <img src="images/art3.jpg" alt="Ethereal Structuralism" class="art-image">
            <div class="art-info">
                <div class="art-title">Ethereal Structuralism</div>
                <div class="art-collection">Architectural Interiors</div>
            </div>
        </div>

    </div>

    <script>
        const slider = document.getElementById('slider');
        const panels = document.querySelectorAll('.art-panel');
        let currentIndex = 0;
        
        let isAnimating = false; // Animasyon bitmeden diğerine geçmeyi engeller
        let wheelDeltaAccumulator = 0; // Tekerlek dönüşlerini sayar
        const SCROLL_THRESHOLD = 120; // 120 birim (Yaklaşık 2-3 tık demektir)

        // Yanlışlıkla hafif dokunmaları sıfırlamak için zamanlayıcı
        let resetTimer;

        window.addEventListener('wheel', (e) => {
            if (isAnimating) return; // Zaten kayıyorsa fareyi dinleme

            // Farenin ne kadar döndüğünü hafızaya ekle
            wheelDeltaAccumulator += e.deltaY;

            // Eğer 2-3 tıktan (120'den) fazla aşağı kaydırıldıysa
            if (wheelDeltaAccumulator > SCROLL_THRESHOLD) {
                if (currentIndex < panels.length - 1) {
                    goToSlide(currentIndex + 1);
                }
                wheelDeltaAccumulator = 0;
            } 
            // Eğer 2-3 tıktan (120'den) fazla yukarı kaydırıldıysa
            else if (wheelDeltaAccumulator < -SCROLL_THRESHOLD) {
                if (currentIndex > 0) {
                    goToSlide(currentIndex - 1);
                }
                wheelDeltaAccumulator = 0;
            }

            // Fareyi çevirmeyi bırakırsan yarım saniye sonra sayacı sıfırla
            clearTimeout(resetTimer);
            resetTimer = setTimeout(() => {
                wheelDeltaAccumulator = 0;
            }, 300);
        });

        function goToSlide(index) {
            isAnimating = true;
            
            // Asansörü (-100vh, -200vh vb) aşağı kaydır
            slider.style.transform = `translateY(-${index * 100}vh)`;
            
            // Eski aktif resmi sönük yap
            panels[currentIndex].classList.remove('active');
            
            currentIndex = index;
            
            // Yeni gelen resmi patlat
            panels[currentIndex].classList.add('active');

            // 1.2 saniye sonra (animasyon bitince) kilidi aç
            setTimeout(() => {
                isAnimating = false;
            }, 1200); 
        }
    </script>

</body>
</html>
